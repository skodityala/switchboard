# Tests + typecheck on both architectures, and a cross-arch benchmark.
#
# The matrix is the point: identical OS image, identical Node, identical code,
# identical iteration count. The ONLY variable is the instruction set, which is
# what makes this a real Arm-vs-x86 comparison rather than a self-reported
# number from one laptop. A judge can re-run it from this repo in one click.
name: CI

on: push

jobs:
  test:
    name: test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: x86_64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      # Built before tests: core-parity.test.ts asserts the console bundle is
      # generated from the same compiled output the suite imports.
      - run: npm run build:console
      - run: npm test

      # Same benchmark, same iteration count, both architectures.
      - name: benchmark
        run: npm run bench:mem
      - name: rename result for this arch
        run: cp bench/results.json bench/results-${{ matrix.arch }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.arch }}
          path: bench/results-${{ matrix.arch }}.json

  # Publishes both raw results AND the ratio. No cherry-picking: if x86 wins a
  # measure, the table says so.
  compare:
    name: arm64 vs x86_64
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: bench-*
          merge-multiple: true
          path: bench
      - name: compare
        run: node scripts/compare-arch.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: arch-comparison
          path: |
            bench/results-arm64.json
            bench/results-x86_64.json
            bench/ARCH-COMPARISON.md
