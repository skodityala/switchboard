# One workflow: tests + typecheck on push. No deploy pipelines, no others.
# arm64 runner matches the build machine (Apple Silicon) — the platform claim in
# the Arm Create cut is exercised in CI, not just asserted in the README.
name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
